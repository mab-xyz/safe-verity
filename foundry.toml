[profile.default]
src = "test/ref"
test = "test"
out = "forge-out"
libs = ["lib"]
evm_version = "cancun"
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/", "safe/=lib/safe-smart-account/contracts/"]
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./forge-out" }]

[profile.default.fuzz]
runs = 512
